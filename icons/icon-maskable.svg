<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Android uyarlanabilir simge: zemin tam kare, gösterge güvenli alanda (%80) -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B2550"/><stop offset="1" stop-color="#0B0E18"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4CC9F0"/><stop offset="1" stop-color="#2F7FD8"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5A524"/><stop offset="1" stop-color="#C26100"/></linearGradient>
    <clipPath id="dial"><circle cx="128" cy="128" r="84"/></clipPath>
  </defs>
  <rect width="256" height="256" fill="url(#plate)"/>
  <g transform="translate(128 128) scale(0.78) translate(-128 -128)">
    <g clip-path="url(#dial)" transform="rotate(-12 128 128)">
      <rect x="20" y="20" width="216" height="110" fill="url(#sky)"/>
      <rect x="20" y="128" width="216" height="110" fill="url(#ground)"/>
      <rect x="20" y="125" width="216" height="6" fill="#FFFFFF"/>
    </g>
    <circle cx="128" cy="128" r="84" fill="none" stroke="#E6E9F5" stroke-width="10"/>
    <path d="M78 136 h34 l16 14 l16 -14 h34" fill="none" stroke="#0B0E18" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="128" cy="128" r="8" fill="#0B0E18"/>
  </g>
</svg>
